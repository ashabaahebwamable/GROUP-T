name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f BSE4104-SME-PROCUREMENT-AGENT/requirements.txt ]; then pip install -r BSE4104-SME-PROCUREMENT-AGENT/requirements.txt; fi
          pip install pytest

      - name: Run test suite
        run: pytest BSE4104-SME-PROCUREMENT-AGENT/tests/ -v
